<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>조퇴증 · 인천하늘초</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f7aec'/%3E%3Cpath d='M7 18.5h10.2a4.3 4.3 0 0 0 .55-8.56A5.8 5.8 0 0 0 6.6 9.3 4.6 4.6 0 0 0 7 18.5Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>
  body{background:linear-gradient(180deg,#d6e8ff 0,#eaf3ff 240px,var(--bg) 460px) no-repeat,var(--bg);min-height:100vh}
  .pass{max-width:440px;margin:0 auto;padding:22px 16px 40px}
  .school{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 16px;font-size:14px;font-weight:700;color:var(--ink-2)}
  .school .mark{width:28px;height:28px;border-radius:9px}
  .school .mark svg{width:17px;height:17px}
  .slip-img{display:block;width:100%;height:auto;border-radius:18px;-webkit-touch-callout:default}
  .skeleton{aspect-ratio:1080/1560;border-radius:22px;background:linear-gradient(100deg,#e9eef5 30%,#f6f8fb 50%,#e9eef5 70%) 0 0/200% 100%;animation:shine 1.3s linear infinite}
  @keyframes shine{to{background-position:-200% 0}}
  .actions{margin-top:16px}
  .hint{margin:10px 0 0;text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
  .fail{margin-top:8px;padding:18px;border-radius:16px;background:var(--bad-50);color:var(--bad);font-weight:700;text-align:center}
</style>
</head>
<body>
<div class="pass">
  <div class="school">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M7 18.5h10.2a4.3 4.3 0 0 0 .55-8.56A5.8 5.8 0 0 0 6.6 9.3 4.6 4.6 0 0 0 7 18.5Z" fill="#fff"/></svg></span>
    인천하늘초등학교 조퇴증
  </div>
  <div id="view"><div class="skeleton"></div></div>
  <div id="actions" class="actions hidden">
    <button id="save" class="primary block lg">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
      사진으로 저장하기
    </button>
    <p class="hint">저장이 안 되면 위 조퇴증 사진을 <b>길게 눌러</b> 저장하세요.<br>교문에서 저장한 사진을 보여 주면 됩니다.</p>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/[^a-f0-9]/gi, '');
let canvas, slip;

(async function () {
  if (!TOKEN) return fail('잘못된 링크입니다.');
  try {
    slip = await run('getPass', TOKEN);
    canvas = await drawSlip(slip);
    const img = new Image();
    img.className = 'slip-img';
    img.alt = '조퇴증';
    img.src = canvas.toDataURL('image/png');
    $('#view').innerHTML = '';
    $('#view').appendChild(img);
    if (slip.status !== '취소') $('#actions').classList.remove('hidden');
  } catch (e) { fail(e.message); }
})();

function fail(msg) { $('#view').innerHTML = `<div class="fail">${esc(msg)}</div>`; }

$('#save').onclick = async () => {
  try { await saveCanvas(canvas, slipFileName(slip)); toast('조퇴증 사진을 저장했어요.'); }
  catch (e) { toast('사진을 길게 눌러 저장해 주세요.'); }
};
</script>
</body>
</html>
